<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        table {
            width: 100%;
            border-collapse: collapse;
            margin: auto;
        }
        th, td {
            border: 1px solid black;
            height: 10rem;
        }
        th {
            text-align: left;
        }
        .color1 {
            background-color: rgba(74, 190, 74, 0.596);
        }
        .color2 {
            background-color: lightgray;
        }
    </style>

</head>
<body>
    <table>
        <tr>
            <th class="color1">something1</th>
            <th class="color2">something2</th>
        </tr>
    </table>
</body>
</html>
